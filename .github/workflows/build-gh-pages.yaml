name: NodeJS with Vite/Rspack

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ✅
        uses: actions/checkout@v6

      - name: Use Node.js ⚡
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install pnpm 🎁
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo 🔧
        run: pnpm run build:demo

      - name: Verify demo output 🔍
        run: |
          test -d demo
          test -f demo/index.html
          test "$(find demo -type f | wc -l)" -gt 1
          find demo -maxdepth 2 -type f -print

      - name: Deploy to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: demo # The folder the action should deploy.
          clean: true
          single-commit: true
